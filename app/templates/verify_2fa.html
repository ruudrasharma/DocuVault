<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuVault — 2FA Verification</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<canvas class="particles-canvas" id="particles"></canvas>


<div class="login-wrap" style="z-index:10">
  <div class="verify-card">

    <!-- Header -->
    <div class="login-header" style="text-align:center;padding:36px 40px 24px">
      <!-- Animated shield icon -->
      <div style="width:72px;height:72px;margin:0 auto 20px;position:relative">
        <div style="width:72px;height:72px;border-radius:50%;background:var(--cyan-dim);border:1.5px solid var(--border-glow);display:flex;align-items:center;justify-content:center;animation:iconPulse 2s ease-in-out infinite">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- Rotating ring -->
        <div style="position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(37,99,235,0.25);animation:ringRotate 6s linear infinite"></div>
      </div>

      <h1 class="login-title" style="font-size:18px">TWO-FACTOR AUTH</h1>
      <p style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:6px">
        Open your authenticator app and enter the 6-digit code
      </p>
    </div>

    <div class="login-body" style="padding:28px 40px 36px">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash-msg flash-{{ 'error' if category == 'error' else 'success' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="/verify_2fa" id="otp-form">
        <label class="form-label" style="text-align:center;display:block;margin-bottom:16px">
          AUTHENTICATOR CODE
        </label>

        <!-- 6-digit OTP boxes -->
        <div class="otp-input-row" style="margin-bottom:28px" id="otp-boxes">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="0" id="d0">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="1" id="d1">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="2" id="d2">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="3" id="d3">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="4" id="d4">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="5" id="d5">
        </div>

        <!-- Hidden real input -->
        <input type="hidden" name="totp" id="totp-val">

        <button type="submit" class="btn-primary" id="verify-btn">
          <span id="verify-btn-text">⟶ VERIFY ACCESS</span>
        </button>
      </form>

      <div style="margin-top:20px;text-align:center">
        <a href="/logout" style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);text-decoration:none;transition:color 0.2s"
          onmouseover="this.style.color='var(--cyan)'" onmouseout="this.style.color='var(--text-muted)'">
          ← Back to Login
        </a>
      </div>

      <!-- Timer -->
      <div style="margin-top:16px;text-align:center">
        <div class="chain-badge">
          <div class="chain-dot"></div>
          <span id="otp-timer" style="font-family:var(--font-mono);font-size:10px">Refreshes in <span id="countdown">30</span>s</span>
        </div>
      </div>

    </div>
  </div>
</div>


<script>
// Particles
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, pts = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  window.addEventListener('resize', resize); resize();
  for(let i=0;i<40;i++) pts.push({x:Math.random()*9999,y:Math.random()*9999,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()+.3,a:Math.random()});
  function draw() {
    ctx.clearRect(0,0,W,H);
    pts.forEach(p => {
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x%W,p.y%H,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(37,99,235,${p.a*.3})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// OTP input logic
const digits = document.querySelectorAll('.otp-digit');
digits.forEach((d, i) => {
  d.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g,'');
    e.target.value = v;
    if(v) { e.target.classList.add('filled'); if(i<5) digits[i+1].focus(); }
    else e.target.classList.remove('filled');
    syncOTP();
    if(getAllDigits().length === 6) submitOTP();
  });
  d.addEventListener('keydown', e => {
    if(e.key==='Backspace' && !e.target.value && i>0) { digits[i-1].focus(); digits[i-1].value=''; digits[i-1].classList.remove('filled'); }
    if(e.key==='ArrowLeft' && i>0) digits[i-1].focus();
    if(e.key==='ArrowRight' && i<5) digits[i+1].focus();
  });
  d.addEventListener('paste', e => {
    e.preventDefault();
    const txt = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
    txt.split('').forEach((ch,j) => { if(digits[j]) { digits[j].value=ch; digits[j].classList.add('filled'); } });
    syncOTP();
    if(txt.length===6) submitOTP();
  });
});

function getAllDigits() { return [...digits].map(d=>d.value).join(''); }
function syncOTP() { document.getElementById('totp-val').value = getAllDigits(); }
function submitOTP() {
  syncOTP();
  document.getElementById('verify-btn-text').textContent = '▶ VERIFYING...';
  document.getElementById('otp-form').submit();
}

// Auto focus first
digits[0].focus();

// TOTP countdown
let secs = 30;
const cd = document.getElementById('countdown');
setInterval(() => { secs = secs <= 1 ? 30 : secs-1; cd.textContent = secs; }, 1000);

// Form submit
document.getElementById('otp-form').addEventListener('submit', () => {
  document.getElementById('verify-btn-text').textContent = '▶ VERIFYING...';
});
</script>
</body>
</html>
